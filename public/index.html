<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PriceCompare</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="light">

<header class="header">

    <div class="logo">
        <i class="fa-solid fa-tags"></i>
        <span>PriceCompare</span>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            id="search"
            type="text"
            placeholder="Поиск товара..."
            autocomplete="off"
        >
    </div>

    <div class="header-actions">

        <select id="languageSelect">
            <option value="ru">RU</option>
            <option value="uz">UZ</option>
            <option value="en">EN</option>
        </select>

        <select id="currencySelect">
            <option value="USD">USD $</option>
            <option value="UZS">UZS so'm</option>
            <option value="EUR">EUR €</option>
            <option value="JPY">JPY ¥</option>
            <option value="RUB">RUB ₽</option>
        </select>

        <button id="themeBtn" class="header-btn" type="button">
            <i class="fa-solid fa-palette"></i>
        </button>

        <button id="favoritesBtn" class="header-btn favorite-header" type="button">
            <i class="fa-solid fa-heart"></i>
            <span id="favCount">0</span>
        </button>

    </div>

</header>


<div id="themePanel" class="theme-panel">

    <h3>Themes</h3>

    <button class="theme-option" data-theme="light">☀️ Light</button>
    <button class="theme-option" data-theme="dark">🌙 Dark</button>
    <button class="theme-option" data-theme="blue">🔵 Blue</button>
    <button class="theme-option" data-theme="purple">🟣 Purple</button>
    <button class="theme-option" data-theme="cyber">🤖 Cyber</button>
    <button class="theme-option" data-theme="aurora">🌌 Aurora</button>
    <button class="theme-option" data-theme="galaxy">🚀 Galaxy</button>
    <button class="theme-option" data-theme="matrix">💚 Matrix</button>
    <button class="theme-option" data-theme="black">⚫ Pure Black</button>
    <button class="theme-option" data-theme="white">⚪ Pure White</button>

</div>


<section class="hero">

    <h1 id="heroTitle">Сравнивайте цены за несколько секунд</h1>

    <p id="heroText">
        Найдите самое выгодное предложение среди популярных товаров
    </p>

</section>


<section class="filters">

    <select id="storeFilter">
        <option value="all">Все источники</option>
        <option value="Demo Catalog">Demo Catalog</option>
    </select>

    <select id="sort">
        <option value="cheap">Сначала дешёвые</option>
        <option value="expensive">Сначала дорогие</option>
        <option value="rating">По рейтингу</option>
    </select>

    <div class="range-box">
        <input
            type="range"
            id="priceRange"
            min="0"
            max="2000"
            value="2000"
        >

        <span id="priceDisplay">до $2000</span>
    </div>

    <button id="clearFilters" class="clear-btn" type="button">
        <i class="fa-solid fa-rotate-left"></i>
        <span id="clearText">Очистить</span>
    </button>

</section>


<section class="stats">

    <div class="stat-card">
        <i class="fa-solid fa-box"></i>

        <div>
            <strong id="count">0</strong>
            <span id="productsText">Товаров найдено</span>
        </div>
    </div>

    <div class="stat-card">
        <i class="fa-solid fa-database"></i>

        <div>
            <strong id="storesCount">1</strong>
            <span id="sourcesText">Источников</span>
        </div>
    </div>

    <div class="stat-card">
        <i class="fa-solid fa-dollar-sign"></i>

        <div>
            <strong id="avgPrice">$0</strong>
            <span id="averageText">Средняя цена</span>
        </div>
    </div>

    <div class="stat-card">
        <i class="fa-solid fa-heart"></i>

        <div>
            <strong id="favTotal">0</strong>
            <span id="favoritesText">В избранном</span>
        </div>
    </div>

</section>


<main>

    <div id="products" class="products-grid"></div>

</main>


<div id="favoritesModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="favoritesTitle">Избранное</h2>

            <button id="closeModal" type="button">&times;</button>
        </div>

        <div id="favoritesList"></div>

    </div>

</div>


<footer>

    <strong>PriceCompare</strong>

    <p id="footerText">
        Сервис поиска и сравнения товаров.
    </p>

    <small>© 2026 PriceCompare</small>

</footer>


<script src="script.js"></script>

</body>
</html>
